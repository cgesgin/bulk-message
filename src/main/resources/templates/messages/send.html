<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head th:replace="~{fragments/layout :: head('Mesaj Gönder')}">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <div class="container flex-grow-1">
        <div class="card message-form">
            <div class="card-header">
                <h4 class="mb-0">WhatsApp Mesaj Gönder</h4>
            </div>
            <div class="card-body">
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${success}">Başarılı</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}">Hata</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form id="messageForm" th:action="@{/messages/send}" method="post" onsubmit="return validateForm()">
                    <!-- Kişi Seçme -->
                    <div class="mb-4">
                        <label class="form-label">Alıcı</label>
                        
                        <!-- Manuel Numara Girişi -->
                        <div class="input-group mb-2">
                            <input type="text" class="form-control" id="manualNumber" name="manualNumber"
                                   placeholder="Telefon numarası girin (örn: 5551234567)">
                            <span class="input-group-text">veya</span>
                            <button class="btn btn-outline-secondary" type="button" 
                                    data-bs-toggle="modal" data-bs-target="#contactModal">
                                <i class="bi bi-search"></i> Kişi Seç
                            </button>
                        </div>

                        <!-- Seçilen Kişi Gösterimi -->
                        <div id="selectedContact" class="selected-contact" style="display: none;">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong id="contactName"></strong>
                                    <div class="text-muted small" id="contactNumber"></div>
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-danger" onclick="clearContact()">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                        </div>
                        <input type="hidden" id="contactId" name="contactId">
                    </div>

                    <!-- Mesaj Yazma Alanı -->
                    <div class="mb-4">
                        <label class="form-label">Mesaj</label>
                        <textarea class="form-control message-textarea" id="messageText" 
                                name="messageText" required
                                placeholder="Mesajınızı yazın..."></textarea>
                        <div class="character-count mt-1">
                            <span id="charCount">0</span> karakter
                        </div>
                    </div>

                    <!-- Mesaj Adedi -->
                    <div class="mb-4">
                        <label class="form-label">Mesaj Adedi</label>
                        <div class="input-group" style="width: 200px;">
                            <button class="btn btn-outline-secondary" type="button" onclick="updateCount(-1)">
                                <i class="bi bi-dash"></i>
                            </button>
                            <input type="number" class="form-control text-center" id="messageCount" 
                                   name="messageCount" value="1" min="1" max="100">
                            <button class="btn btn-outline-secondary" type="button" onclick="updateCount(1)">
                                <i class="bi bi-plus"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Mesaj Adedi kısmından sonra ekleyelim -->
                    <div class="mb-4">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="enableSchedule" onchange="toggleSchedule()">
                            <label class="form-check-label" for="enableSchedule">Mesajı Planla</label>
                        </div>
                        
                        <div id="scheduleContainer" style="display: none;">
                            <div class="input-group">
                                <input type="datetime-local" class="form-control" id="scheduledTime" name="scheduledTime">
                                <button type="submit" class="btn btn-primary" name="action" value="schedule">
                                    <i class="bi bi-clock"></i> Planla
                                </button>
                            </div>
                            <div class="form-text">
                                <i class="bi bi-info-circle"></i> 
                                Seçilen tarih ve saatte mesaj otomatik olarak gönderilecektir.
                            </div>
                        </div>
                    </div>

                    <!-- Gönder butonundan önce planlanan mesajları görüntüleme linki ekleyelim -->
                    <div class="mb-4 text-end">
                        <a href="/scheduled-messages" class="btn btn-outline-primary">
                            <i class="bi bi-list-check"></i> Planlanan Mesajları Görüntüle
                        </a>
                    </div>

                    <!-- Progress Container -->
                    <div id="sendingProgress" style="display: none;">
                        <div class="d-flex align-items-center mb-2">
                            <div class="progress flex-grow-1" style="height: 20px;">
                                <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" 
                                     id="progressBar" role="progressbar" 
                                     style="width: 0%" aria-valuenow="0" 
                                     aria-valuemin="0" aria-valuemax="100">
                                    <span id="progressText">0%</span>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <div class="text-muted" id="statusMessage">
                                <i class="bi bi-arrow-repeat spin me-1"></i>
                                Mesaj gönderiliyor...
                            </div>
                            <div class="badge bg-primary" id="messageCounter">
                                <i class="bi bi-envelope-fill me-1"></i>
                                <span id="currentMessageCount">0</span>/<span id="totalMessageCount">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- Success Message -->
                    <div id="successMessage" class="text-center" style="display: none;">
                        <div class="alert alert-success d-inline-flex align-items-center px-4">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            Mesaj başarıyla gönderildi!
                        </div>
                    </div>

                    <!-- Normal gönder butonu -->
                    <div class="d-grid" id="normalSendButton">
                        <button type="submit" class="btn btn-success btn-lg" id="sendButton" name="action" value="send">
                            <i class="bi bi-send"></i> Mesaj Gönder
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Kişi Seçme Modalı -->
    <div class="modal fade" id="contactModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Kişi Seç</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control mb-3" id="modalContactSearch" 
                           placeholder="Kişilerde ara...">
                    <div class="contact-select">
                        <div class="list-group" th:if="${contacts != null}">
                            <a href="#" class="list-group-item list-group-item-action" 
                               th:each="contact : ${contacts}"
                               th:onclick="'selectContact(\'' + ${contact.id} + '\', \'' + ${contact.displayName} + '\', \'' + ${contact.number} + '\')'">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <strong th:text="${contact.displayName}">İsim</strong>
                                        <div class="text-muted small" th:text="${contact.number}">Numara</div>
                                    </div>
                                    <span th:class="${'badge ' + 
                                        (contact.business ? 'bg-warning' : 
                                         contact.group ? 'bg-info' : 'bg-primary')}"
                                          th:text="${contact.accountType}">Tip</span>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>

    <!-- Scripts -->
    <script>
        const contactModal = new bootstrap.Modal(document.getElementById('contactModal'));
        
        function selectContact(id, name, number) {
            document.getElementById('contactId').value = id;
            document.getElementById('contactName').textContent = name;
            document.getElementById('contactNumber').textContent = number;
            document.getElementById('selectedContact').style.display = 'block';
            document.getElementById('manualNumber').value = '';
            document.getElementById('manualNumber').disabled = true;
            contactModal.hide();
        }

        function clearContact() {
            document.getElementById('contactId').value = '';
            document.getElementById('selectedContact').style.display = 'none';
            document.getElementById('manualNumber').disabled = false;
        }

        function updateCount(change) {
            const input = document.getElementById('messageCount');
            let value = parseInt(input.value) + change;
            value = Math.max(1, Math.min(100, value));
            input.value = value;
        }

        // Karakter sayısı
        document.getElementById('messageText').addEventListener('input', function() {
            document.getElementById('charCount').textContent = this.value.length;
        });

        // Modal içi arama
        document.getElementById('modalContactSearch').addEventListener('keyup', function() {
            const searchText = this.value.toLowerCase();
            document.querySelectorAll('.list-group-item').forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(searchText) ? '' : 'none';
            });
        });

        // Manuel numara girildiğinde seçili kişiyi temizle
        document.getElementById('manualNumber').addEventListener('input', function() {
            if (this.value) {
                clearContact();
            }
        });

        function toggleSchedule() {
            const scheduleContainer = document.getElementById('scheduleContainer');
            const enableSchedule = document.getElementById('enableSchedule');
            const normalSendButton = document.getElementById('normalSendButton');
            
            scheduleContainer.style.display = enableSchedule.checked ? 'block' : 'none';
            normalSendButton.style.display = enableSchedule.checked ? 'none' : 'block';
        }

        function validateForm() {
            const enableSchedule = document.getElementById('enableSchedule');
            const scheduledTime = document.getElementById('scheduledTime');
            
            if (enableSchedule.checked) {
                if (!scheduledTime.value) {
                    alert('Lütfen bir tarih seçin!');
                    return false;
                }
                
                const selectedDate = new Date(scheduledTime.value);
                const now = new Date();
                
                if (selectedDate <= now) {
                    alert('Lütfen gelecekte bir tarih seçin!');
                    return false;
                }
            }
            return true;
        }
    </script>
</body>
</html>
