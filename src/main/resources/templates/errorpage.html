<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oops! Something Went Wrong.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/errorpage.css">
</head>
<body>
  <div class="error-container">
    <div class="error-content">
      <h1 class="error-code">404</h1>
      <p class="error-message">Oops! Looks like you're lost in space.</p>
      <p class="error-submessage">Don't worry, we'll get you back on track!</p>
      <a href="/dashboard" class="error-button">Go to Dashboard</a>
    </div>
    <div class="error-image"><br/>
      <img src="https://media.giphy.com/media/3o7TKMkOGzzf5dVm6Y/giphy.gif" alt="Lost in space" />
    </div>
  </div>
</body>
</html>
