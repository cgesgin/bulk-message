<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">WhatsApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar Fragment -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-whatsapp me-2"></i>WhatsApp Yönetimi
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/messages/send}" 
                           th:classappend="${activeTab == 'send' ? 'active' : ''}">
                            <i class="bi bi-send me-1"></i>Mesaj Gönder
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/scheduled-messages}"
                           th:classappend="${activeTab == 'scheduled' ? 'active' : ''}">
                            <i class="bi bi-clock-history me-1"></i>Planlanan Mesajlar
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Footer Fragment -->
    <footer th:fragment="footer" class="footer mt-auto py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">
                <i class="bi bi-whatsapp text-success"></i> WhatsApp Bulk Message Sender &copy; 2024
            </span>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        </div>
    </footer>
</body>
</html>
