spring:
  application:
    name: bulk-message

  datasource:
    url: jdbc:mysql://localhost:3306/springmvctutorial
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  config:
    import:
      - optional:whatsapp.yml

server:
  port: ${PORT:8080}